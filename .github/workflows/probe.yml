name: Probe
on: push
jobs:
  probe:
    if: "!startsWith(github.event.head_commit.message, 'ci: probe result')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run probe
        run: |
          {
            echo "runner: $(uname -a)"
            echo "time: $(date -u)"
            echo "jdk: $(java -version 2>&1 | head -1)"
            echo "sdk: ${ANDROID_HOME:-unset}"
            ls "$ANDROID_HOME" 2>/dev/null | head -30
            echo "ref: $GITHUB_REF_NAME"
            echo "token len: ${#GITHUB_TOKEN}"
          } > probe.txt
      - name: Push result
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add probe.txt
          git commit -m "ci: probe result" || true
          git push origin "HEAD:refs/heads/ci-probe-output" --force || \
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME" --force || \
          (echo "PUSH FAILED" > pushfail.txt && git add pushfail.txt && git commit -m "ci: probe result pushfail" && git push origin "HEAD:refs/heads/ci-probe-output" --force)
