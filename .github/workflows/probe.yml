name: Probe
on:
  push:
    branches: ['arena/**']
jobs:
  probe:
    if: "!startsWith(github.event.head_commit.message, 'ci: probe result')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run probe
        run: |
          echo "runner: $(uname -a)" > probe.txt
          echo "time: $(date -u)" >> probe.txt
          echo "jdk: $(java -version 2>&1 | head -1)" >> probe.txt
          echo "sdk: ${ANDROID_HOME:-unset}" >> probe.txt
          ls "$ANDROID_HOME" 2>/dev/null | head -30 >> probe.txt || true
      - name: Push result
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add probe.txt
          git commit -m "ci: probe result"
          git push origin "$GITHUB_REF_NAME"
