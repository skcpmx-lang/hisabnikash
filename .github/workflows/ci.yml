name: Build
on:
  push:
    branches: ['arena/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create signing keystore
        run: |
          mkdir -p keystore
          PASS="hisabnikash-ci-$(date +%s)"
          keytool -genkeypair -v \
            -keystore keystore/release.jks -storepass "$PASS" -keypass "$PASS" \
            -alias hisabnikash -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=HisabNikash, OU=Commerce OS, O=Shohan Khan, L=Dhaka, C=BD"
          printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=hisabnikash\nkeyPassword=%s\n' "$PASS" "$PASS" > keystore.properties
          echo "SDK platforms:"; ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "SDK build-tools:"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Build and test
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace > build-log.txt 2>&1
          echo "GRADLE_EXIT=$?" | tee -a build-log.txt
          exit 0

      - name: Collect output
        run: |
          mkdir -p ci-output
          cp build-log.txt ci-output/build-log.txt || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ci-output/HisabNikash-release.apk
          fi
          find app/build -path '*test-results*' -name '*.xml' -exec cp {} ci-output/ \; 2>/dev/null || true
          find app/build -path '*reports*' -name '*.html' -exec cp {} ci-output/ \; 2>/dev/null || true
          ls -la ci-output

      - name: Publish output branch
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-output || true
          git commit -m "ci: build output" || true
          git push origin "HEAD:refs/heads/ci-artifacts" --force
